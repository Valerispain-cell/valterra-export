<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
:root {
  --navy:  #1F3059;
  --cream: #F2F2F0;
  --slate: #7A8089;
  --steel: #6B96C3;
  --n08:   rgba(31,48,89,0.08);
  --n20:   rgba(31,48,89,0.20);
  --n45:   rgba(31,48,89,0.45);
  --n70:   rgba(31,48,89,0.70);
  --div:   rgba(31,48,89,0.10);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--cream); color: var(--navy); padding: 24px 20px 64px; }
.page { max-width: 1160px; margin: 0 auto; }

/* NAV */
.nav { background: var(--navy); border-radius: 4px; padding: 16px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 48px; }
.nav-right { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.nav-meta { color: var(--slate); font-size: 9px; letter-spacing: 0.13em; text-transform: uppercase; line-height: 1.8; text-align: right; }

/* LANG */
.lang-toggle { display: flex; border: 1px solid rgba(242,242,240,0.25); border-radius: 4px; overflow: hidden; flex-shrink: 0; }
.lang-btn { padding: 8px 18px; font-size: 11px; font-weight: 500; letter-spacing: 0.10em; cursor: pointer; border: none; background: transparent; color: var(--slate); font-family: 'Plus Jakarta Sans', sans-serif; transition: all 150ms; min-width: 52px; -webkit-tap-highlight-color: transparent; }
.lang-btn.on { background: var(--cream); color: var(--navy); }

/* HERO */
.hero { padding-left: 24px; border-left: 2px solid var(--navy); margin-bottom: 48px; }
.caps-label { font-size: 9px; font-weight: 400; letter-spacing: 0.14em; color: var(--slate); text-transform: uppercase; margin-bottom: 10px; }
.hero-number { font-size: 68px; font-weight: 500; color: var(--navy); letter-spacing: -0.025em; line-height: 1; margin-bottom: 10px; }
.hero-unit { font-size: 28px; font-weight: 400; color: var(--slate); }
.hero-sub { font-size: 14px; font-weight: 400; color: var(--n70); margin-bottom: 6px; line-height: 1.6; }
.hero-note { font-size: 12px; font-weight: 400; color: var(--slate); line-height: 1.6; }

/* KPI */
.kpi-strip { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--div); border: 1px solid var(--div); border-radius: 4px; overflow: hidden; margin-bottom: 56px; }
.kpi { background: var(--cream); padding: 18px 14px; }
.kpi-lbl { font-size: 8px; font-weight: 400; letter-spacing: 0.12em; color: var(--slate); text-transform: uppercase; margin-bottom: 8px; }
.kpi-val { font-size: 26px; font-weight: 500; color: var(--navy); letter-spacing: -0.02em; line-height: 1; margin-bottom: 5px; }
.kpi-delta { font-size: 10px; color: var(--slate); line-height: 1.4; }

/* SECTION */
.section { margin-bottom: 56px; }
.section-label { font-size: 9px; font-weight: 400; letter-spacing: 0.14em; color: var(--slate); text-transform: uppercase; margin-bottom: 16px; padding-bottom: 10px; border-bottom: 1px solid var(--div); }

/* CARD */
.card { background: var(--cream); border: 1px solid var(--div); border-radius: 4px; padding: 22px 26px; transition: background 200ms ease; }
.card:hover { background: #E8E8E5; }
.card-title { font-size: 10px; font-weight: 500; letter-spacing: 0.10em; text-transform: uppercase; color: var(--navy); margin-bottom: 18px; }

/* GRID */
.g-6-4 { display: grid; grid-template-columns: 3fr 2fr; gap: 16px; }

/* CHART */
.cw { position: relative; width: 100%; }

/* TABS */
.tabs { display: inline-flex; flex-wrap: wrap; gap: 0; margin-bottom: 20px; border: 1px solid var(--div); border-radius: 4px; overflow: hidden; }
.tab { padding: 7px 12px; font-size: 9px; font-weight: 400; letter-spacing: 0.10em; cursor: pointer; border: none; border-right: 1px solid var(--div); background: transparent; color: var(--slate); font-family: 'Plus Jakarta Sans', sans-serif; transition: all 150ms; -webkit-tap-highlight-color: transparent; }
.tab:last-child { border-right: none; }
.tab:hover { background: var(--n08); color: var(--navy); }
.tab.on { background: var(--navy); color: var(--cream); }

/* LEGEND */
.legend { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--div); }
.leg-item { display: flex; align-items: center; gap: 7px; font-size: 10px; color: var(--slate); }
.leg-line { width: 20px; height: 2px; flex-shrink: 0; }

/* NOTE */
.note { font-size: 10px; color: var(--n70); margin-top: 12px; line-height: 1.7; padding-top: 12px; border-top: 1px solid var(--div); }

/* TRANSPORT */
.transp-row { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--div); }
.transp-row:last-child { border-bottom: none; }
.transp-lbl { font-size: 9px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--slate); min-width: 100px; }
.transp-bar-bg { flex: 1; background: var(--n08); border-radius: 2px; height: 5px; overflow: hidden; }
.transp-bar-fill { height: 100%; background: var(--navy); border-radius: 2px; }
.transp-pct { font-size: 12px; font-weight: 500; color: var(--navy); min-width: 28px; text-align: right; }
.transp-vol { font-size: 10px; color: var(--slate); min-width: 80px; text-align: right; }

/* CARRY */
.carry-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--div); border: 1px solid var(--div); border-radius: 4px; overflow: hidden; margin-bottom: 16px; }
.carry-card { background: var(--cream); padding: 16px; }
.carry-crop { font-size: 9px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--slate); margin-bottom: 8px; }
.carry-bar { width: 100%; height: 2px; background: var(--navy); border-radius: 1px; margin-bottom: 10px; }
.carry-prod { font-size: 17px; font-weight: 500; color: var(--navy); letter-spacing: -0.02em; line-height: 1; margin-bottom: 2px; }
.carry-unit { font-size: 9px; font-weight: 400; color: var(--slate); }
.carry-row { display: flex; justify-content: space-between; align-items: baseline; padding: 5px 0; border-bottom: 1px solid var(--div); }
.carry-row:last-of-type { border-bottom: none; }
.carry-key { font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--slate); }
.carry-num { font-size: 11px; font-weight: 500; color: var(--navy); }
.carry-delta { font-size: 9px; color: var(--slate); margin-top: 8px; }
.carry-src { font-size: 8px; color: var(--n45); margin-top: 4px; }

/* RISK styles removed */

/* NEWS */
.news-item { display: flex; align-items: flex-start; padding: 14px 22px; border-bottom: 1px solid var(--div); text-decoration: none; transition: background 180ms ease; }
.news-item:last-child { border-bottom: none; }
.news-item:hover { background: #E8E8E5; }
.news-tag { font-size: 9px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--cream); background: var(--navy); padding: 3px 8px; border-radius: 3px; white-space: nowrap; flex-shrink: 0; margin-top: 2px; margin-right: 14px; min-width: 84px; text-align: center; }
.news-tag.warn   { background: var(--n45); }
.news-tag.good   { background: rgba(31,48,89,0.65); }
.news-tag.signal { background: var(--steel); }
.news-body { flex: 1; }
.news-headline { font-size: 12px; font-weight: 500; color: var(--navy); line-height: 1.5; margin-bottom: 3px; }
.news-meta { font-size: 10px; color: var(--slate); }
.news-arrow { font-size: 14px; color: var(--n20); flex-shrink: 0; margin-left: 12px; margin-top: 1px; transition: color 180ms; }
.news-item:hover .news-arrow { color: var(--navy); }

/* SEP */
.sep { height: 1px; background: var(--div); margin: 16px 0; }

/* FOOTER */
.footer { background: var(--navy); border-radius: 4px; padding: 20px 28px; display: flex; align-items: center; justify-content: space-between; margin-top: 56px; gap: 28px; flex-wrap: wrap; }
.footer-src { font-size: 9px; color: var(--slate); letter-spacing: 0.04em; line-height: 1.8; flex: 1; }

/* RESPONSIVE */
@media (max-width: 960px) {
  .g-6-4 { grid-template-columns: 1fr; }
  .kpi-strip  { grid-template-columns: repeat(3, 1fr); }
  .carry-grid { grid-template-columns: repeat(3, 1fr); }
  .hero-number { font-size: 52px; }
}
@media (max-width: 600px) {
  body { padding: 14px 14px 48px; }
  .nav { padding: 14px 16px; }
  .nav-meta { display: none; }
  .kpi-strip  { grid-template-columns: repeat(2, 1fr); }
  .carry-grid { grid-template-columns: repeat(2, 1fr); }
  .hero-number { font-size: 42px; }
  .tab { padding: 7px 8px; font-size: 8px; }
}
</style>

function buildCarry(){
  const el=document.getElementById('carryCards'), L=lang;
  CARRY.forEach(c=>{
    const eL=L==='uk'?'Експорт':'Export', sL=L==='uk'?'Залишок':'Ending stock', hL=L==='uk'?'врожай 2025':'crop 2025';
    el.innerHTML+=`<div class="carry-card"><div class="carry-crop">${L==='uk'?c.uk_c:c.en_c}</div><div class="carry-bar"></div><div class="carry-prod">${c.harvest} <span class="carry-unit">${hL}</span></div><div class="carry-row"><span class="carry-key">${eL}</span><span class="carry-num">${L==='uk'?c.uk_e:c.en_e}</span></div><div class="carry-row"><span class="carry-key">${sL}</span><span class="carry-num">${L==='uk'?c.uk_s:c.en_s}</span></div><div class="carry-delta">${L==='uk'?c.uk_d:c.en_d}</div><div class="carry-src">${c.src}</div></div>`;
  });
}
